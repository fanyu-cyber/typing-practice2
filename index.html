<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>純淨打字截圖區</title>
    <style>
        /* 重置基本設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 背景設定：加上一點淺灰底色，讓白色的打字區更突出，截圖更好看 */
        body {
            background-color: #f0f2f5; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* 填滿整個螢幕高度 */
            padding: 20px;
        }

        /* 打字輸入格主體設定 */
        textarea {
            width: 100%;
            height: 100%;
            max-width: 1200px; /* 限制最大寬度，避免在大螢幕上單行字數過長導致閱讀疲勞 */
            background-color: #ffffff;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); /* 加上柔和的陰影，截圖時有立體感 */
            padding: 50px; /* 留出舒服的邊界空白 */
            
            /* 字體與排版設定 */
            font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; /* 優先使用最清晰的繁體黑體 */
            font-size: 28px; /* 大小適中，13吋螢幕可塞下300字以上 */
            line-height: 1.7; /* 拉寬行距，一目了然 */
            letter-spacing: 1px; /* 微調字距 */
            color: #2c3e50; /* 使用深藍灰色代替純黑，看起來更柔和高級 */
            
            resize: none; /* 禁止使用者手動拉動改變大小 */
            outline: none; /* 點擊時不會出現醜醜的預設外框 */
        }

        /* 提示文字的顏色 */
        textarea::placeholder {
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <textarea id="typingBox" placeholder="請在此直接輸入文字... (已關閉複製貼上與右鍵功能，請全程手動輸入)"></textarea>

    <script>
        const box = document.getElementById('typingBox');

        // 1. 禁止貼上 (Paste)
        box.addEventListener('paste', function(e) {
            e.preventDefault();
            alert("⚠️ 此區域禁止貼上，請自己手動輸入喔！");
        });

        // 2. 禁止複製 (Copy) 與 剪下 (Cut) - 確保內容不能被輕易帶走
        box.addEventListener('copy', function(e) {
            e.preventDefault();
        });
        box.addEventListener('cut', function(e) {
            e.preventDefault();
        });

        // 3. 鎖定右鍵選單
        box.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>

</body>
</html>
